<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joueurs connectés</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 15px; background: #f4f4f4; }
    h1 { text-align: center; }
    #search { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
    th { background: #333; color: white; }
    a { color: #0066cc; }
  </style>
</head>
<body>
  <h1>Joueurs connectés : <span id="count">0</span></h1>
  <input id="search" type="text" placeholder="Rechercher (nom d'utilisateur, nom d'affichage ou ID)...">
  <table>
    <thead><tr><th>Nom d'utilisateur</th><th>Nom d'affichage</th><th>ID Roblox</th></tr></thead>
    <tbody id="list"></tbody>
  </table>

  <script>
    let players = [];
    const list = document.getElementById("list");
    const search = document.getElementById("search");
    const count = document.getElementById("count");

    function render() {
      const q = search.value.trim().toLowerCase();
      const filtered = players.filter((p) =>
        p.username.toLowerCase().includes(q) ||
        p.displayName.toLowerCase().includes(q) ||
        String(p.userId).includes(q)
      );
      list.innerHTML = "";
      if (filtered.length === 0) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 3;
        td.textContent = "Aucun joueur trouvé.";
        tr.appendChild(td);
        list.appendChild(tr);
        return;
      }
      filtered.forEach((p) => {
        const tr = document.createElement("tr");
        const a = document.createElement("a");
        a.href = "https://www.roblox.com/users/" + p.userId + "/profile";
        a.target = "_blank";
        a.textContent = p.username;
        const td1 = document.createElement("td");
        td1.appendChild(a);
        const td2 = document.createElement("td");
        td2.textContent = p.displayName;
        const td3 = document.createElement("td");
        td3.textContent = p.userId;
        tr.append(td1, td2, td3);
        list.appendChild(tr);
      });
    }

    async function load() {
      try {
        const res = await fetch("/api/players");
        const data = await res.json();
        players = data.players;
        count.textContent = data.count;
        render();
      } catch (e) { console.error(e); }
    }

    search.addEventListener("input", render);
    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
